services:
  - type: web
    name: haiguitang
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: SQLITE_PATH
        value: /app/data/puzzles.db
      - key: STATIC_DIR
        value: /app/static
      # jev → 默认 Vercel AI Gateway，只填 key
      - key: JEV_API_KEY
        sync: false
      # LLM → 任意 chat/completions
      - key: AI_API_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false

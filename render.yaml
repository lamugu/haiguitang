services:
  - type: web
    name: haiguitang
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: SQLITE_PATH
        value: /app/data/puzzles.db
      - key: STATIC_DIR
        value: /app/static
      # 判决 → Vercel AI Gateway
      - key: AI_GATEWAY_URL
        value: https://ai-gateway.vercel.sh/v1
      - key: AI_GATEWAY_MODEL
        value: openai/gpt-4o-mini
      - key: AI_GATEWAY_API_KEY
        sync: false
      # 原 LLM（导入 / 判答案）
      - key: AI_API_URL
        value: https://api.atria-asi.ai/v1
      - key: AI_MODEL
        value: Atria-Dawn-Preview
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
